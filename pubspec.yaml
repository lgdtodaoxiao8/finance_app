name: finance_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  google_fonts: ^6.3.1
  intl: ^0.20.2
  dropdown_button2: ^2.3.9
  flutter_colorpicker: ^1.0.0
  # currency_picker: ^2.0.21

  # --- Architecture (Phase 1: data layer + DI) ---
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.4
  get_it: ^8.0.3
  # --- State management (Phase 2: BLoC) ---
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  # --- Analytics (Phase 3: charts) ---
  fl_chart: ^0.69.2
  # --- Home-screen widgets ---
  home_widget: ^0.7.0
  # --- Product: onboarding / illustrations / prefs / links ---
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
